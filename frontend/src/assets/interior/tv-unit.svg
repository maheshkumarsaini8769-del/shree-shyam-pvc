<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="tvWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE4"/>
      <stop offset="100%" stop-color="#E5DECf"/>
    </linearGradient>
    <linearGradient id="tvConsoleWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F473A"/>
      <stop offset="100%" stop-color="#553428"/>
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="url(#tvWall)"/>
  <polygon points="0,460 800,460 800,600 0,600" fill="#9C8976"/>

  <!-- Left Slat Panel Section -->
  <rect x="80" y="30" width="180" height="430" fill="#4E2F24" rx="2"/>
  <g fill="#6E4537">
    <rect x="92" y="30" width="10" height="430"/>
    <rect x="110" y="30" width="10" height="430"/>
    <rect x="128" y="30" width="10" height="430"/>
    <rect x="146" y="30" width="10" height="430"/>
    <rect x="164" y="30" width="10" height="430"/>
    <rect x="182" y="30" width="10" height="430"/>
    <rect x="200" y="30" width="10" height="430"/>
    <rect x="218" y="30" width="10" height="430"/>
    <rect x="236" y="30" width="10" height="430"/>
  </g>

  <!-- Main Marble Finish PVC Backer Sheet -->
  <rect x="270" y="50" width="450" height="290" fill="#FAF7F2" stroke="#DFD4C3" stroke-width="2" rx="4"/>
  <path d="M300,70 Q370,160 480,180 T680,240" stroke="#D1C3AF" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Ambient LED Backlight strip around panel -->
  <rect x="265" y="45" width="460" height="300" rx="6" fill="none" stroke="#FFE79A" stroke-width="6" opacity="0.6" filter="blur(6px)"/>

  <!-- Television Screen with Thin Bezel -->
  <rect x="320" y="80" width="350" height="200" rx="3" fill="#121212"/>
  <rect x="325" y="85" width="340" height="190" fill="#202020"/>
  <!-- Display Art Wallpaper -->
  <circle cx="495" cy="160" r="45" fill="#E65100" opacity="0.7"/>
  <polygon points="325,230 420,170 520,220 620,150 665,190 665,275 325,275" fill="#2E2C2B"/>

  <!-- Floating PVC Console Below -->
  <rect x="250" y="365" width="480" height="65" rx="4" fill="url(#tvConsoleWood)"/>
  <line x1="410" y1="365" x2="410" y2="430" stroke="#3D231B" stroke-width="2"/>
  <line x1="570" y1="365" x2="570" y2="430" stroke="#3D231B" stroke-width="2"/>
  <!-- Sleek handles -->
  <rect x="290" y="375" width="80" height="5" rx="2" fill="#D4AF37"/>
  <rect x="450" y="375" width="80" height="5" rx="2" fill="#D4AF37"/>
  <rect x="610" y="375" width="80" height="5" rx="2" fill="#D4AF37"/>
  <!-- Console Bottom Glow -->
  <rect x="270" y="428" width="440" height="12" fill="#FFE59E" opacity="0.5" filter="blur(6px)"/>

  <!-- Badge -->
  <g transform="translate(100, 500)">
    <rect width="250" height="32" rx="16" fill="#1D1D1B" opacity="0.9"/>
    <text x="125" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">CONCEALED WIRE CHANNELS</text>
  </g>
</svg>
